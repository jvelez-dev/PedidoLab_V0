services:
  # Ejecuta la suite de pruebas: docker compose run --rm tests
  tests:
    build: .
    image: pedidolab:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - HOME=/tmp
    volumes:
      - .:/app
    command: pytest

  # Ejecuta el demo: docker compose run --rm demo
  demo:
    image: pedidolab:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - HOME=/tmp
    volumes:
      - .:/app
    command: python demo.py

  # Shell interactiva: docker compose run --rm shell
  shell:
    image: pedidolab:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - HOME=/tmp
    volumes:
      - .:/app
    command: bash
    stdin_open: true
    tty: true
